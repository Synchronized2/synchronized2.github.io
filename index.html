<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#030407">
    <meta name="description" content="一个可交互的 3D 太阳系与银河系。探索太阳、八大行星、月球以及我们的银河家园。">
    <title>Solar System / 太阳系</title>
    <link rel="icon" href="images/solar-icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css?v=14">
</head>
<body>
    <main class="solar-app" id="solarApp">
        <canvas id="spaceCanvas" aria-label="可交互的 3D 太阳系"></canvas>

        <header class="topbar">
            <button class="brand" id="homeButton" type="button" aria-label="返回太阳系全景">
                <span class="brand-orbit" aria-hidden="true"><i></i></span>
                <span><strong>SOLAR SYSTEM</strong><small>INTERACTIVE ORRERY</small></span>
            </button>
            <div class="status" aria-label="模拟状态">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="simulationStatus">REAL-TIME MODEL</span>
                <span class="status-divider"></span>
                <time id="solarDate">--</time>
            </div>
            <div class="toolbar" aria-label="场景控制">
                <button class="icon-button active" id="orbitButton" type="button" aria-pressed="true" aria-label="显示轨道" title="显示或隐藏轨道">
                    <span class="orbit-icon" aria-hidden="true"></span>
                </button>
                <button class="icon-button active" id="labelButton" type="button" aria-pressed="true" aria-label="显示行星名称" title="显示或隐藏行星名称">
                    <span class="label-icon" aria-hidden="true">Aa</span>
                </button>
                <button class="icon-button" id="pauseButton" type="button" aria-pressed="false" aria-label="暂停运行" title="暂停或继续运行">
                    <span id="pauseIcon" aria-hidden="true">Ⅱ</span>
                </button>
            </div>
        </header>

        <section class="scene-title" aria-labelledby="pageTitle">
            <span class="eyebrow">THE LOCAL NEIGHBORHOOD</span>
            <h1 id="pageTitle">太阳系</h1>
            <p>从太阳出发，穿过八颗行星的漫长轨道。</p>
        </section>

        <nav class="planet-index" id="planetIndex" aria-label="选择天体"></nav>
        <div class="planet-labels" id="planetLabels" aria-hidden="true"></div>

        <section class="focus-intro" id="focusIntro" aria-live="polite">
            <span class="focus-serial" id="focusSerial">03</span>
            <div>
                <small id="focusType">PLANET FOCUS</small>
                <strong id="focusName">地球</strong>
                <p id="focusTagline">一颗拥有海洋与生命的蓝色星球</p>
            </div>
        </section>

        <aside class="planet-sheet" id="planetSheet" aria-hidden="true">
            <div class="sheet-accent" id="sheetAccent"></div>
            <div class="sheet-header">
                <div>
                    <span class="sheet-index" id="sheetIndex">03 / PLANET</span>
                    <h2 id="sheetTitle">地球</h2>
                    <p id="sheetLatin">EARTH</p>
                </div>
                <button class="close-button" id="closeSheetButton" type="button" aria-label="关闭行星资料" title="关闭">×</button>
            </div>
            <p class="sheet-description" id="sheetDescription"></p>
            <dl class="planet-stats">
                <div><dt id="statLabelDistance">距太阳</dt><dd id="statDistance">--</dd></div>
                <div><dt id="statLabelYear">公转周期</dt><dd id="statYear">--</dd></div>
                <div><dt id="statLabelDiameter">直径</dt><dd id="statDiameter">--</dd></div>
                <div><dt id="statLabelMoons">卫星</dt><dd id="statMoons">--</dd></div>
            </dl>
            <button class="reset-view" id="resetViewButton" type="button">返回太阳系全景</button>
        </aside>

        <div class="time-control" aria-label="时间速度">
            <button id="slowerButton" type="button" aria-label="减慢时间" title="减慢">−</button>
            <div><span>TIME SCALE</span><strong id="speedValue">1×</strong></div>
            <button id="fasterButton" type="button" aria-label="加快时间" title="加快">＋</button>
        </div>

        <p class="interaction-hint"><span aria-hidden="true">↔</span> 拖动观察 · 滚轮缩放 · 点击天体</p>

        <div class="loading-screen" id="loadingScreen">
            <span class="loading-sun" aria-hidden="true"></span>
            <div><strong>正在进入太阳系</strong><span>CALIBRATING ORBITS</span></div>
            <i></i>
        </div>

        <div class="webgl-fallback" id="webglFallback" hidden>
            <strong>无法启动 3D 场景</strong>
            <p>请检查网络连接并确认浏览器已启用 WebGL。</p>
        </div>
        <noscript><p class="noscript">需要启用 JavaScript 才能观察太阳系。</p></noscript>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" defer></script>
    <script src="js/solar-system.js?v=14" defer></script>
</body>
</html>
